name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job has never been green - every run since 2026-09-30 failed. The
    # failures are stale assertions, not regressions: the suite still looks for
    # UI that has since been renamed or replaced (the "Advanced" grading card,
    # the plugin Import button, the pop-out action, the preset cards, the
    # drawing inspector header). See issue #138 for the per-assertion list.
    #
    # While the assertions are brought back in line with the current UI, the
    # job keeps running and keeps reporting - it just no longer blocks a merge
    # on its own. Every other check (typecheck, lint, unit tests, the
    # dependency audit, the cross-OS builds) is still a hard gate. Set this
    # back to `false` once #138 is done.
    continue-on-error: true
    env:
      DATABASE_URL: "postgresql://artidor:***@localhost:5432/artidor"
      BETTER_AUTH_SECRET: "ci-only-secret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3005"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
      PEXELS_API_KEY: "placeholder"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - run: bunx playwright test

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
